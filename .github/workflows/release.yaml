name: Build and Release Animated Cursors

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "CursorConverter/**"
      - "assets/**"
      - "parse_directories.py"
      - "process_cursors.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Audit cursor catalog
        run: uv run --locked --no-dev python parse_directories.py
      - name: Process complete animated themes
        run: uv run --locked --no-dev python process_cursors.py --jobs 2
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.zip
