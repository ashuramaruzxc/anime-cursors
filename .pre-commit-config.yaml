repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
